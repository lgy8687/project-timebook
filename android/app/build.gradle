plugins {
    id 'com.android.application'
}

// Internal test APKs must keep the same signature as the phone install.
// Do not fall back to this machine's ~/.android/debug.keystore — that caused
// update conflicts when cloud agents rebuilt with a different debug key.
def internalKeystore = rootProject.file('keystore/timebook-debug.keystore')

android {
    namespace 'io.github.lgy8687.timebook'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.lgy8687.timebook'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '0.12-offline-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        internalDebug {
            storeFile internalKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.internalDebug
            minifyEnabled false
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

def prepareWebAssets = tasks.register('prepareWebAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'tools/prepare-web-assets.mjs'
}
tasks.named('preBuild').configure { dependsOn prepareWebAssets }

gradle.taskGraph.whenReady { graph ->
    def needsInternalKey = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains('release') && (
            name.contains('assemble')
            || name.contains('bundle')
            || name.contains('package')
            || name.contains('sign')
            || name.contains('install')
        )
    }
    if (needsInternalKey && !internalKeystore.isFile()) {
        throw new GradleException(
            "Missing ${internalKeystore}. Copy your Mac debug keystore first:\n" +
            "  bash android/tools/install-local-signing-keystore.sh\n" +
            "Default source is ~/.android/debug.keystore. Do not commit the keystore."
        )
    }
}
